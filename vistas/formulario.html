<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario Registro</title>

    <link rel="stylesheet" href="../css/formulario.css">
</head>

<body>
    <div class="contenedorPrincipal">
        <div class="navegacion"></div>

        <form action="">
            <h1>Formulario de Registro</h1>
            <br>

            <div>
                <label for="inputNombre">Nombre: </label>
                <input type="text" name="nombre" id="inputNombre">

                <label for="inputCorreo">Email: </label>
                <input type="email" name="correo" id="inputCorreo">
            </div>
            <br>

            <div>
                <label for="inputFechaNacimiento">Fecha de Nacimiento: </label>
                <input type="date" name="fechaNacimiento" id="inputFechaNacimiento">

                <label for="inputRut">RUT: </label>
                <input type="text" name="rut" id="inputRut">
            </div>
            <br>

            <div>
                <label for="inputContrasena">Contraseña: </label>
                <input type="password" name="contrasena" id="inputContrasena">

                <label for="inputContrasena">Repetir Contraseña: </label>
                <input type="password" name="repetirContrasena" id="inputRepetirContrasena">
            </div>
            <br>

            <div>
                <input type="reset" value="Cancelar" class="btnCancelar">
                <input type="submit" value="Enviar" class="btnEnviar">
            </div>
        </form>
    </div>

</body>

</html>
